[project]
name = "household-tools"
version = "0.1.0"
description = "Personal household MCP tools for Hermes Agent"
requires-python = ">=3.11,<3.15"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
household-tools = "household_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_tools"]
