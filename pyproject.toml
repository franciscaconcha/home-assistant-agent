[project]
name = "household-tools"
version = "0.1.0"
description = "Personal household MCP tools for Hermes Agent"
requires-python = ">=3.11,<3.15"
dependencies = [
    "google-auth[requests]>=2,<3",
    "httpx>=0.28,<1",
    "mcp>=1.12,<2",
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
household-tools = "household_tools.server:main"
household-yoto-login = "household_tools.yoto_setup:login"
household-yoto-configure = "household_tools.yoto_setup:configure"
household-yoto-check = "household_tools.yoto_setup:check"
household-yoto-enable-times = "household_tools.yoto_setup:enable_schedule"
household-yoto-schedule-worker = "household_tools.integrations.yoto_override:worker"
household-ocado-login = "household_tools.ocado_setup:login"
household-ocado-configure = "household_tools.ocado_setup:configure"
household-ocado-check = "household_tools.ocado_setup:check"
household-ocado-order-check = "household_tools.ocado_setup:order_check"
household-ocado-enable-editing = "household_tools.ocado_setup:enable_editing"
household-ocado-enable-weekly = "household_tools.ocado_setup:enable_weekly"
household-calendar-configure = "household_tools.calendar_setup:configure"
household-calendar-check = "household_tools.calendar_setup:check"

[project.optional-dependencies]
ocado-login = [
    "playwright>=1.55,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_tools"]
