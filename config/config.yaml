# Initial template, copied only when data/config.yaml does not exist.
# Select provider/model with `make setup`; no model or keys are hard-coded here.
whatsapp:
  unauthorized_dm_behavior: ignore
  group_policy: pairing
  send_read_receipts: false

mcp_servers:
  household:
    command: /opt/household-tools/.venv/bin/household-tools
    # Hermes filters subprocess environments; explicitly pass the profile's data path.
    env:
      HERMES_HOME: "${HERMES_HOME}"
    timeout: 120
    tools:
      include: [household_status, yoto_list_players, yoto_player_status, yoto_playback, yoto_set_volume, ocado_basket, ocado_next_order, ocado_plan_order_changes, household_list_recipes, household_get_recipe, household_save_recipe, ocado_weekly_plan, ocado_list_occasional_items, ocado_get_occasional_item, ocado_save_occasional_item, calendar_status, calendar_list_events, calendar_create_event]
    sampling:
      enabled: false
